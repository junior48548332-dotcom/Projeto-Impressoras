[pytest]

# Pasta onde ficam os testes
testpaths = tests

# Nomes reconhecidos como teste
python_files = test_*.py
python_functions = test_*

# Coloca a pasta do projeto no caminho de busca do Python,
# assim os testes conseguem importar config, banco, app etc.
pythonpath = .

# Saída resumida e legível
addopts = -v --tb=short
